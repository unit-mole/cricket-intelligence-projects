name: IPL Production Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
        working-directory: 01-ipl-intelligence-production
      - run: pip install -r requirements.txt
        working-directory: 01-ipl-intelligence-production
      - run: pip install -e .
        working-directory: 01-ipl-intelligence-production
      - run: pytest -q
        working-directory: 01-ipl-intelligence-production
